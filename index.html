<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Form</title>
</head>
<body>
  <form action="/create" method="post">
    <label for="fullName">Full Name:</label>
    <input 
      type="text" 
      placeholder="John Doe" 
      name="fullName" 
      id="fullName"
    >
    <button type="submit">Submit</button>
  </form>
</body>
</html>
